# for local development you can use podman's kube support
# https://docs.podman.io/en/v4.4/markdown/podman-kube-play.1.html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
    config.toml: |
      redis_url = "redis://redis:6379/1"
      [list_lengths]
      name = "foobar"
      keys = ["abc", "xyz"]
---
apiVersion: v1
kind: Pod
metadata:
  name: redics-pod
spec:
  containers:
  - name: redics
    image: redics
    ports:
    - containerPort: 8000
      hostPort: 8000
    env:
      - name: REDICS_CONFIG
        value: /etc/redics/config.toml
    volumeMounts:
    - name: config-volume
      mountPath: /etc/redics
  - name: redis
    image: docker.io/library/redis:8
    ports:
    - containerPort: 6379
      hostPort: 6379
  volumes:
  - name: config-volume
    configMap:
      name: config
